services:
  - type: web
    name: nexusbot
    runtime: node
    plan: free
    repo: https://github.com/nexustechpro2/NexusBot.git
    region: oregon
    branch: main
    buildCommand: npm install --production
    startCommand: npm run start
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: SESSION_ID
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexusbot-db
          property: connectionPoolString

databases:
  - name: nexusbot-db
    plan: free
    databaseName: nexusbot
    user: nexusbot
    region: oregon
    connectionPool: pgbouncer