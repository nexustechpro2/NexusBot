services:
  - type: web
    name: nexusbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SESSION_ID
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexusbot-db
          property: connectionString

databases:
  - name: nexusbot-db
    plan: free
    databaseName: nexusbot
    user: nexusbot