services:
  - type: web
    name: nexusbot
    runtime: node
    plan: free
    repo: https://github.com/nexustechpro2/NexusBot.git
    buildCommand: npm install
    startCommand: npm run start
    autoDeploy: false
    envVars:
      - key: SESSION_ID
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexusbot-db
          property: connectionString

databases:
  - name: nexusbot-db
    plan: free
    databaseName: nexusbot
    user: nexusbot