services:
  - type: web
    name: nexusbot
    runtime: node
    plan: free
    buildCommand: npm install --ignore-optional
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: SESSION_ID
        sync: false
      - key: WHATSAPP_PHONE_NUMBER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexusbot-db
          property: connectionString

databases:
  - name: nexusbot-db
    plan: free
    databaseName: nexusbot
    user: nexusbot