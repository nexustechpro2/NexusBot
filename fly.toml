app = "nexusbot"
primary_region = "lax"

[build]
  builder = "heroku/buildpacks:20"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "nexusbot_sessions"
  destination = "/app/sessions"

[[services.tcp_checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "30s"