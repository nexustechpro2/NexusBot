[build]
builder = "railpack"
buildCommand = "npm install"

[deploy]
startCommand = "node main.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services.variables]]
name = "SESSION_ID"
required = true

[[services.variables]]
name = "WHATSAPP_PHONE_NUMBER"
required = false

[[services.variables]]
name = "DATABASE_URL"
required = true